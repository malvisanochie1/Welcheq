name: Keep the API awake

# Render's free plan sleeps after 15 idle minutes, which makes the next visit wait almost a
# minute. A light health check every 10 minutes keeps the first visit fast.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check the API is up
        run: curl --fail --silent --show-error --max-time 90 --retry 2 https://welcheq-api.onrender.com/health
