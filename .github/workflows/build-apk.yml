name: Build Android APK

on: workflow_dispatch

permissions:
  contents: read

env:
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check app configuration
        run: |
          for name in EXPO_PUBLIC_API_URL EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set"
              exit 1
            fi
          done

      - uses: ./.github/actions/setup-expo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        working-directory: frontend
        run: eas build --platform android --profile preview --non-interactive --wait --json > build.json

      - name: Publish download link
        working-directory: frontend
        run: |
          URL=$(node -p "require('./build.json')[0].artifacts.buildUrl")
          ID=$(node -p "require('./build.json')[0].id")
          OWNER=$(node -p "require('./app.json').expo.owner")
          SLUG=$(node -p "require('./app.json').expo.slug")
          echo "APK: $URL"
          echo "Page: https://expo.dev/accounts/$OWNER/projects/$SLUG/builds/$ID"
          echo "## APK ready: $URL" >> "$GITHUB_STEP_SUMMARY"
