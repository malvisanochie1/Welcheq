name: Build Android APK

on: workflow_dispatch

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the Android build
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: ./.github/actions/setup-expo
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        working-directory: frontend
        run: eas build --local --platform android --profile preview --non-interactive --output welcheq.apk

      - name: Publish download link
        working-directory: frontend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="android-v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" welcheq.apk \
            --title "Welcheq ${VERSION} (Android build ${GITHUB_RUN_NUMBER})" \
            --notes "Install on Android: open this link on the phone and allow installs from this source." \
            --prerelease
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/welcheq.apk"
          echo "APK: $URL"
          echo "## APK ready: $URL" >> "$GITHUB_STEP_SUMMARY"
