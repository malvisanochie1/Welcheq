services:
  - type: web
    name: welcheq-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --workspace backend --workspace shared && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - shared/**
        - package-lock.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
